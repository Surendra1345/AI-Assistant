<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
  <header>Jarvis</header>
  <main id="log" aria-live="polite"></main>
  <form id="bar">
    <button type="button" id="mic" title="Tap to speak" aria-label="Voice input">🎤</button>
    <input id="text" type="text" placeholder="Ask Jarvis..." autocomplete="off">
    <button type="submit" id="send">Send</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
